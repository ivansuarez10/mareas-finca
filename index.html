if(corta)T={ini:0,finA:0,amp:0,vuelo:100,vueloDur:500,nombreOut:1,fondoDe:120,fondoDur:330,llenoDur:1,placaDur:250};
var PISO=.12,TECHO=.92,Y_FONDO=26.7,Y_TOPE=1.9;
function el(tag,at,par){var n=document.createElementNS(NS,tag);for(var k in at)n.setAttribute(k,at[k]);if(par)par.appendChild(n);return n}
function onda(wl,amp,w0,w1){var d='M'+w0+' 0',n=Math.ceil((w1-w0)/(wl/2));d+='q'+(wl/4)+' '+(-amp)+' '+(wl/2)+' 0';for(var i=1;i<n;i++)d+='t'+(wl/2)+' 0';return d+'L'+w1+' 0L'+w0+' 0Z'}
function A(nodo,kf,op){var a=nodo.animate(kf,Object.assign({fill:'both',easing:'linear'},op));anims.push(a);return a}
var vaso=lienzo.querySelector('.fs-vaso'),lleno=null,agua=null,amps=[];
if(!ninguna){
  lleno=el('use',{href:'#fs-p',fill:CREMA,opacity:'0'},lienzo);   /* el camarón completo: el cierre y la versión corta */
  if(!corta&&!rm){
    var defs=el('defs',{},lienzo),cp=el('clipPath',{id:'fs-clip'},defs);el('use',{href:'#fs-p'},cp);
    var g=el('g',{'clip-path':'url(#fs-clip)'},lienzo);agua=el('g',{transform:'translate(0 29)'},g);
    el('rect',{x:'-20',y:'0',width:'80',height:'40',fill:CREMA},agua);   /* el cuerpo del agua no se estira: el nivel es el nivel */
    var a2=el('g',{},agua),a1=el('g',{},agua);amps=[a2,a1];
    el('path',{d:onda(14,.9,-16,52),fill:CREMA,'fill-opacity':'.5','class':'fs-ola-b'},a2);
    el('path',{d:onda(10,1.1,-12,50),fill:CREMA,'class':'fs-ola-a'},a1);
    lienzo.insertBefore(defs,lienzo.firstChild);
  }
}
function fin(){if(terminado)return;terminado=true;cancelAnimationFrame(raf);
  anims.forEach(function(a){try{a.cancel()}catch(e){}});
  raiz.hidden=true;H.classList.remove('fs-portada');
  var ap=document.getElementById('app');if(ap)ap.inert=false;
  window.__fsRetiene=false;
  FS.tFin=Math.round(performance.now())}
setTimeout(fin,4000);   /* red de seguridad: la portada nunca pasa de 4 s, haya llegado o no la app */
function marca(){return document.querySelector('.cab__marca svg')}
function fade(ms,delay){if(fadeando)return;fadeando=true;A(raiz,[{opacity:1},{opacity:0}],{delay:delay||0,duration:ms}).finished.then(fin,function(){})}

/* ---- ninguna: la app abre directo; el telón navy solo cubre hasta que haya hojas y app (0 s añadidos) ---- */
if(ninguna){FS.cuando(function(){fade(rm?1:120)});return}

/* ---- reducir movimiento: camarón completo, quieto; solo se desvanece (la opacidad no es movimiento) ---- */
if(rm){lleno.setAttribute('opacity','1');if(vaso)vaso.style.display='none';nombre.style.opacity='1';
  raiz.addEventListener('pointerdown',function(e){e.stopPropagation();if(e.cancelable)e.preventDefault();FS.cuando(function(){fade(200,0)})});
  ['pointerup','click','touchstart','touchend','mousedown','mouseup'].forEach(function(t){raiz.addEventListener(t,function(e){e.stopPropagation();if(e.cancelable)e.preventDefault()},{passive:false})});
  setTimeout(function(){FS.cuando(function(){fade(200,0)})},300);
  return}

/* ---- con movimiento ---- */
if(corta){lleno.setAttribute('opacity','1');if(vaso)vaso.style.display='none';cam.style.opacity='0';A(cam,[{opacity:0},{opacity:1}],{delay:0,duration:80});nombre.style.opacity='0'}
else A(nombre,[{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'translateY(0)'}],{delay:T.nombreIn,duration:T.nombreDur,easing:'cubic-bezier(.16,1,.3,1)'});

/* el vuelo se crea cuando la app ya pintó su placa (destino real); w = cuánto falta para su hora en la línea de tiempo (las animaciones esperan quietas en su primer cuadro) */
var orig=cam.getBoundingClientRect(),dest='';
function kf(dx,dy,sc){return[{transform:'translate(0,0) scale(1)'},{transform:'translate('+dx+'px,'+dy+'px) scale('+sc+')'}]}
/* el destino puede moverse (el panel se acomoda cuando llegan los datos): se vuelve a medir en cada cuadro del vuelo y se corrige sin saltos */
function sigueDestino(){var m=marca();if(!m||!vuelo)return;var d=m.getBoundingClientRect(),dx=d.left-orig.left,dy=d.top-orig.top,sc=d.width/orig.width,k=dx+','+dy+','+sc;
  if(k!==dest&&(Math.abs(dx-dest.split(',')[0])>.25||Math.abs(dy-dest.split(',')[1])>.25)){dest=k;try{vuelo.effect.setKeyframes(kf(dx,dy,sc))}catch(e){}}}
function crearVuelo(w){
  var m=marca(),placa=document.querySelector('.cab__marca');
  if(!m){FS.via='fade';fade(300,w);return}
  FS.via='vuelo';
  var d=m.getBoundingClientRect(),sc=d.width/orig.width,dx=d.left-orig.left,dy=d.top-orig.top;
  cam.style.transformOrigin='0 0';
  vuelo=A(cam,kf(dx,dy,sc),{delay:w,duration:T.vueloDur,easing:E_VUELO});
  dest=dx+','+dy+','+sc;
  if(!corta){A(lleno,[{opacity:0},{opacity:1}],{delay:w,duration:T.llenoDur,easing:'ease-out'});A(nombre,[{opacity:1},{opacity:0}],{delay:w,duration:T.nombreOut})}
  A(fondo,[{opacity:1},{opacity:0}],{delay:w+T.fondoDe,duration:T.fondoDur,easing:'ease-in-out'});
  if(placa)A(placa,[{opacity:0},{opacity:1}],{delay:w+T.vueloDur*(corta?.35:.55),duration:T.placaDur,easing:'ease-out'});
  vuelo.finished.then(fin,function(){});
  if(saltado)acelera();
}
/* toque: el camarón viaja ya al encabezado en 250 ms (nunca un corte seco) */
function acelera(){rate=6;anims.forEach(function(a){var e=a.effect&&a.effect.getTiming();if(!e||a.effect.target===raiz)return;var ct=a.currentTime||0,tg=a.effect.target;
  if(tg===nombre){a.currentTime=Math.max(ct,e.delay||0);a.updatePlaybackRate(8);return}
  if(ct<(e.delay||0))a.currentTime=e.delay;var resto=(e.delay+e.duration)-a.currentTime;if(resto>0)a.updatePlaybackRate(Math.max(1,resto/250))})}
function toque(e){e.stopPropagation();if(e.cancelable)e.preventDefault()}
['pointerup','click','touchstart','touchend','mousedown','mouseup'].forEach(function(t){raiz.addEventListener(t,toque,{passive:false})});   /* el telón es el único blanco hasta fin(): el toque que salta no llega a ningún botón del panel */
raiz.addEventListener('pointerdown',function(e){toque(e);if(terminado||saltado)return;saltado=true;if(vuelo||fadeando)acelera()});
addEventListener('keydown',function(e){if(!terminado&&(e.key==='Enter'||e.key===' '||e.key==='Escape')&&!saltado){saltado=true;if(vuelo||fadeando)acelera()}});

/* ---- el agua ---- */
function nivelVis(){var f=window.__nivelAhora,n=null;try{n=f?f():null}catch(e){}return n==null?null:PISO+(TECHO-PISO)*clamp01(n)}
var tarde=-1,v0=0,cur=null;
/* nivel real o nada: sin dato no hay agua ni marca (nunca "lleno" falso); si llega tarde, el agua sube desde donde esté hasta el nivel real */
function yAgua(ms){var a=T.ini,b=T.finA,L=nivelFijo;
  if(L==null){L=nivelVis();if(L!=null){nivelFijo=L;if(ms>400){tarde=ms;v0=cur==null?0:cur}}}
  if(L==null){cur=null;return null}
  var v;if(tarde>=0)v=v0+(L-v0)*E_BARRE(clamp01((ms-tarde)/500));
  else{var p=E_SUBE(clamp01((ms-a)/(b-a)));v=Math.max(PISO*p,L*p)}
  cur=v;return v}
function pinta(ms){var v=yAgua(ms),y=v==null?29:Y_FONDO-(Y_FONDO-Y_TOPE)*v,fe=tarde>=0?tarde+500:T.finA,amp=ms<fe?1:1-E_BARRE(clamp01((ms-fe)/T.amp));
  agua.setAttribute('transform','translate(0 '+(ms<T.ini?29:y).toFixed(3)+')');
  for(var i=0;i<amps.length;i++)amps[i].setAttribute('transform','scale(1 '+amp.toFixed(3)+')')}
function tick(now){var dt=now-last;last=now;if(dt<0)dt=0;tw+=dt*rate;var ms=now-t0;
  if(agua&&tw<T.vuelo+100)pinta(tw);
  if(!vuelo&&!fadeando){
    if(FS.listo)crearVuelo(Math.max(0,T.vuelo-ms))   /* en cuanto la app pintó su placa: así el costo de medir y de promover capas cae temprano, no en el arranque del vuelo */
    else if(ms>2600)fade(300,0)}   /* la app no llegó: la portada no se alarga más de 2,6 s */
  if(vuelo&&!terminado)sigueDestino();
  if(!terminado)raf=requestAnimationFrame(tick)}
if(agua)pinta(0);
raf=requestAnimationFrame(tick);
})();
</script>
<div id="app" class="app"><noscript><p style="padding:1.5rem;font:400 1.25rem sans-serif">Esta app necesita JavaScript para mostrar las mareas.</p></noscript></div>
<script>
/* PORTADA, paso 4: las hojas ya cargan solas (media=print); los scripts de la app entran DESPUÉS del primer pintado y de las hojas, en orden, sin bloquear. Los datos cargan detrás: nada espera a la portada. */
(function(){var FS=window.FS,S=['data.js','datos-vivos.js','mareas-cristal.js','clima-paletas.js','tinte-motor.js','clima-nubes.js','clima-fondo.js','clima-vivo.js','app.js','clima-prueba.js'],pintado=false,lanzado=false;
function lanza(){if(lanzado||!pintado||!FS.hojas)return;lanzado=true;var n=S.length;
S.forEach(function(u){var s=document.createElement('script');s.src=u;s.async=false;s.onload=s.onerror=function(){if(--n===0){FS.app=true;FS.chequea()}};document.body.appendChild(s)})}
var ap=document.getElementById('app');if(ap&&!FS.tFin)ap.inert=true;   /* mientras haya telón, el teclado no llega a la app de abajo */
FS.alHojas=lanza;
requestAnimationFrame(function(){setTimeout(function(){pintado=true;lanza()},0)});
setTimeout(function(){if(!FS.hojas){FS.hojas=true;lanza()}},2500)})();
</script>
